# 实机任务配置：只在这里选择模型、配置硬件和动作过渡。
# 模型的观测、动作、PD、参考轨迹仍读取各 run 的 params/deploy.yaml。
# 路径相对仓库根目录；不自动选择最新模型。
tasks:
  walk: logs/rsl_rl/nlegs_rough/2026-08-26_20-37-55
  crouch: null
  rise: null

publish_rate: 200
target_ema_alpha: 1.0       # 统一部署与 sim2sim 一致，不叠加目标 EMA
cmd_bias: [0.0, 0.0, 0.0]   # 统一部署不叠加速度零偏
# 走路速度指令截断范围 [最小, 最大]：前后/左右 m/s，转向 rad/s；不得超出训练范围。
velocity_command_limits:
  lin_vel_x: [-0.3, 0.3]
  lin_vel_y: [-0.0, 0.0]
  ang_vel_z: [-0.5, 0.5]

# 话题中的实机顺序；策略顺序从各模型按关节名读取。
joint_index_in_real: ["L1","L2","L3","L4","L5","L6","R1","R2","R3","R4","R5","R6"]
# 目标角度裁剪边界；运行中不再因实测角越界自动中断。
joint_lower_limits: [-1.05, -0.26, -1.0, -0.5, -0.45, -0.5,
                     -1.05, -1.05, -1.0, -0.5, -0.45, -0.5]
joint_upper_limits: [ 1.0,   1.05,  1.0, 1.92, 1.0,  0.5,
                      1.0,   0.26,  1.0, 1.92, 1.0,  0.5]

use_derived_vel: false     # 默认直接使用电机上报速度
vel_ema_alpha: 0.5         # 仅差分速度模式使用
deadzone: 0.12
ctrl_timeout: 0.4          # s，手柄消息过期归零
keyboard:
  step: 0.05
# game_controller_node 的 SDL 标准编号；LB+A/X/Y 选择任务，B 中断，Back 解锁。
gamepad_buttons: {a: 0, b: 1, x: 2, y: 3, lb: 9, back: 4, start: 6}

# 2026-09-17 11:02 只读标定，机身前倾 29.729°；与 v2 起身的 10 个单侧端点一致。
# 用于初始姿态分类和 10 个单侧任务目标边界，不改模型、参考动作或上方目标裁剪边界。
crouch_calibration:
  joint_pos:
    L1: -0.9752422370
    L2:  0.4964904250
    L3:  0.4983978027
    L4:  1.0561150530
    L5: -0.3763256275
    L6: -0.2019913024
    R1: -0.9676127260
    R2: -0.5270084688
    R3: -0.6185626001
    R4:  1.0912108034
    R5: -0.4224841688
    R6:  0.2233539330
  body_quat_wxyz: [0.9590230509, -0.0273425805, 0.2551135463, 0.1201842318]
  stop_sides: {L1: lower, L2: upper, L3: upper, L4: upper, L5: lower,
              R1: lower, R2: lower, R3: lower, R4: upper, R5: lower}

multi_task:
  handover_time: 0.20
  stop_blend_time: 0.50
  return_max_speed: 0.15   # rad/s，4 / LB+Start 手动回准备站姿的目标峰值速度
