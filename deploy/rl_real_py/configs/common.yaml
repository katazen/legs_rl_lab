# 实机任务配置：只在这里选择模型、配置硬件和动作过渡。
# 模型的观测、动作、PD、参考轨迹仍读取各 run 的 params/deploy.yaml。
# 路径相对仓库根目录；不自动选择最新模型。
tasks:
  walk: logs/rsl_rl/nlegs_body_rough/2026-11-03_11-24-26_w1196
  crouch: null
  rise: null

publish_rate: 200
# 速度范围直接读取所选模型 params/deploy.yaml，不额外覆盖训练范围。

# 话题中的实机顺序；策略顺序从各模型按关节名读取。
joint_index_in_real: ["L1","L2","L3","L4","L5","L6","R1","R2","R3","R4","R5","R6"]
# RL 只做训练动作的 scale/offset 和关节顺序转换，不设置关节角度限位。

deadzone: 0.12
ctrl_timeout: 0.4          # s，手柄消息过期归零
keyboard:
  step: 0.05
# SDL 标准编号；LB+A/X/Y 选择任务，RB 切换左摇杆/方向键平移，右摇杆始终转向。
gamepad_buttons: {a: 0, b: 1, x: 2, y: 3, lb: 9, rb: 10, back: 4, start: 6}

# 2026-09-17 11:02 只读标定，机身前倾 29.729°；与 v2 起身的 10 个单侧端点一致。
# 仅在启用起身时用于初始姿态分类，不进入网络观测。
crouch_calibration:
  joint_pos:
    L1: -0.9752422370
    L2:  0.4964904250
    L3:  0.4983978027
    L4:  1.0561150530
    L5: -0.3763256275
    L6: -0.2019913024
    R1: -0.9676127260
    R2: -0.5270084688
    R3: -0.6185626001
    R4:  1.0912108034
    R5: -0.4224841688
    R6:  0.2233539330

multi_task:
  handover_time: 0.20
  stop_blend_time: 0.50
  return_max_speed: 0.15   # rad/s，4 / LB+Start 手动回准备站姿的目标峰值速度
