# 统一三任务配置：只在这里选择模型、配置硬件和切换阈值。
# 模型的观测、动作、PD、参考轨迹仍读取各 run 的 params/deploy.yaml。
# 路径相对仓库根目录；不自动选择最新模型。
tasks:
  walk: logs/rsl_rl/nlegs_flat_static/2026-09-16_11-41-05
  crouch: logs/rsl_rl/nlegs_mimic_crouch/2026-09-15_15-36-16
  rise: logs/rsl_rl/nlegs_mimic_stand/2026-09-17_12-30-38

publish_rate: 200
target_ema_alpha: 1.0       # 统一部署与 sim2sim 一致，不叠加目标 EMA
cmd_bias: [0.0, 0.0, 0.0]   # 统一部署不叠加速度零偏
state_timeout: 0.06        # s，关节/IMU 反馈超时则锁存停止

# 话题中的实机顺序；策略顺序从各模型按关节名读取。
joint_index_in_real: ["L1","L2","L3","L4","L5","L6","R1","R2","R3","R4","R5","R6"]
# 硬件边界；任务 clip 不能放宽它。R5 下限保留此前实测设置。
joint_lower_limits: [-1.05, -0.26, -1.0, -0.5, -0.45, -0.5,
                     -1.05, -1.05, -1.0, -0.5, -0.45, -0.5]
joint_upper_limits: [ 1.05,  1.05,  1.0, 1.92, 1.0,  0.5,
                      1.05,  0.26,  1.0, 1.92, 1.0,  0.5]

use_derived_vel: false     # 默认直接使用电机上报速度
vel_ema_alpha: 0.5         # 仅差分速度模式使用
deadzone: 0.12
ctrl_timeout: 0.4          # s，手柄消息过期归零
cmd_accel_limit: [0.5, 0.5, 1.0]  # 速度指令缓升/缓降
keyboard:
  step: 0.05
# 按实际手柄 /joy 核对；LB+A/X/Y 选择任务，B 中断，Back 重新验收。
gamepad_buttons: {a: 0, b: 1, x: 2, y: 3, lb: 4, back: 6, start: 7}

# 2026-09-16 16:00 只读标定，机身前倾 32.098°；供旧策略临时验证。
# 只覆盖蹲姿验收和指定的单侧任务边界，不改模型、参考动作或上方硬件限位。
# ankle roll 仅用于姿态验收；重新训练后核对标定，删除本段即恢复训练端点。
crouch_calibration:
  joint_pos:
    L1: -0.9813458457
    L2:  0.5334935531
    L3:  0.5045014115
    L4:  1.0606927596
    L5: -0.3778515297
    L6: -0.2534905013
    R1: -0.9645609216
    R2: -0.5266269932
    R3: -0.6788357366
    R4:  1.0858701457
    R5: -0.4354543374
    R6:  0.2512016480
  body_quat_wxyz: [0.9366867561, -0.0619481135, 0.2694300308, 0.2149134956]
  stop_sides: {L1: lower, L2: upper, L3: upper, L4: upper, L5: lower,
              R1: lower, R2: lower, R3: lower, R4: upper, R5: lower}

multi_task:
  stable_time: 0.30
  joint_tolerance: 0.12
  ankle_roll_tolerance: 0.20
  joint_speed: 0.35
  tilt_error: 0.15
  angular_speed: 0.40
  max_tilt: 0.80
  joint_limit_tolerance: 0.03  # 仅任务反馈容差，不放宽指令或硬件边界
  max_policy_gap: 0.06
  handover_time: 0.20
  handover_max_delta: 0.60
  stop_blend_time: 0.50
  return_max_speed: 0.15   # rad/s，4 / LB+Start 手动回准备站姿的目标峰值速度
  stop_timeout: 6.0
  end_timeout: 4.0
